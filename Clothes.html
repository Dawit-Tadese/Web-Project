<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Clothes Shop</title>

</head>
<body>
 <h1>Cloth Store</h1>

  <div class="products">
    <article class="product">
      <img src="./dress.png" width="200" alt="Dress">
      <h2>Dress</h2>
      <div class="price">$150</div>
      <button type="button">Add to Cart</button>
    </article>
    <br>

    <article class="product">
      <img src="./tishrt.png" width="200" alt="T-shirt">
      <h2>T-shirt</h2>
      <div class="price">$200</div>
      <button type="button">Add to Cart</button>
    </article>
    <br>

    <article class="product">
      <img src="./black shirt.png" width="200" alt="Black T-shirt">
      <h2>Black T-shirt</h2>
      <div class="price">$100</div>
      <button type="button">Add to Cart</button>
    </article>
    <br>

    <article class="product">
      <img src="./hoodies.png" width="200" alt="Hoodie">
      <h2>Hoodie</h2>
      <div class="price">$60</div>
      <button type="button">Add to Cart</button>
    </article>
    <br>

    <article class="product">
      <img src="./jeans.png" width="200" alt="Jeans">
      <h2>Jeans</h2>
      <div class="price">$185</div>
      <button type="button">Add to Cart</button>
    </article>
    <br>
    <article class="product">
      <img src="./kids jacket.png" width="200" alt="Leather Jacket">
      <h2>Leather Jacket</h2>
      <div class="price">$90</div>
      <button type="button">Add to Cart</button>
    </article>
    <br>

    <article class="product">
      <img src="./kids jacket (2).png" width="200" alt="Kids Jacket">
      <h2>Shorts</h2>
      <div class="price">$70</div>
      <button type="button">Add to Cart</button>
    </article>
    <br>

    <article class="product">
      <img src="./top.png" width="200" alt="Top">
      <h2>Crop Top</h2>
      <div class="price">$50</div>
      <button type="button">Add to Cart</button>
    </article>
    <br>
    <article class="product">
      <img src="./trousers.png" width="200" alt="Trousers">
      <h2>Trousers</h2>
      <div class="price">$1500</div>
      <button type="button">Add to Cart</button>
    </article>
    <br>

    <article class="product">
      <img src="./" width="200" height="180" alt="PS5 console">
      <h2>PS5</h2>
      <div class="price">$700</div>
      <button type="button">Add to Cart</button>
    </article>
    <br>
  </div>
</body>
</html>
