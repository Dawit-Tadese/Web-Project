<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  

</head>
<body>
  <main>
    <h1>Your Cart</h1>
    <table border="1">
      <caption>Selected Items</caption>
      <thead>
        <tr>
          <th scope="col">Item</th>
          <th scope="col">Type</th>
          <th scope="col">Price</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Wireless Mouse</td>
          <td>Electronics</td>
          <td>$25.00</td>
        </tr>
        <tr>
          <td>Cotton T-Shirt</td>
          <td>Clothing</td>
          <td>$18.00</td>
        </tr>
        <tr>
          <td>Coffee Mug</td>
          <td>Homeware</td>
          <td>$12.00</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th scope="row" colspan="2">Total</th>
          <td>$55.00</td>
        </tr>
      </tfoot>
    </table>

    <br>
    <br>

    <form action="#">
      <button type="submit">Confirm Purchase</button>
    </form>
  </main>
</body>
</html>
