<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Shopping Cart</title>

<body>

    <main>

        <h1>YOUR CART</h1>

        <br><br>

        <nav>

        <table border="1">

            <tfoot>

                </tr>

        </table>

        <br><br>

        <form action="#">
