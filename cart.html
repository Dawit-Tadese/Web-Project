<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
</head>

<body>

    <header>
        <h1>YOUR CART</h1>
    </header>

    <nav>
        <ul>
            <li><a href="./index.html">Home</a></li>
            <li><a href="./next.html">Categories</a></li>
            <li><a href="./Electronics.html">Electronics</a></li>
            <li><a href="./Clothes.html">Clothes</a></li>
            <li><a href="./Shoes.html">Shoes</a></li>
          
        </ul>
    </nav>

    <main>

        <br><br>

        <table border="1">

            <caption>Selected Items</caption>

            <thead>
                <tr>
                    <th scope="col">Item</th>
                    <th scope="col">Type</th>
                    <th scope="col">Price</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Smartphone</td>
                    <td>Electronics</td>
                    <td>$1000.00</td>
                </tr>

                <tr>
                    <td>Oversized T-Shirt</td>
                    <td>Clothing</td>
                    <td>$50.00</td>
                </tr>

                <tr>
                    <td>Nike</td>
                    <td>Shoe Store</td>
                    <td>$150.00</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <th scope="row" colspan="2">Total</th>
                    <td>$1200.00</td>
                </tr>
            </tfoot>

        </table>

        <br><br>

        <form action="#">
            <button type="submit">Confirm Purchase</button>
        </form>

        <br><br>

        <textarea
            name="feedback"
            rows="4"
            cols="50"
            placeholder="Leave your feedback here..."></textarea>

        <br>

        <button type="submit">Submit Feedback</button>

    </main>

    <footer>
        <p>&copy; 2026 Everything. All rights reserved.</p>
    </footer>

</body>
